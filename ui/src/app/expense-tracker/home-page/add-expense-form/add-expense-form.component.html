<div class="card shadow-lg ">

    <div class="card-header">

        <h1 style="font-weight: bold">Add Expense:</h1>
    </div>
    <div class="card-body">

        <div *ngIf="hasApiError; else apiSuccessMessage">
            <div *ngFor="let errorMessage of apiErrorResponseMessages">
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <strong>ERROR: </strong>{{errorMessage}}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            </div>
        </div>
        <ng-template #apiSuccessMessage>
            <div *ngIf="apiSuccessResponseMessage.length > 0">
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <strong>Success:</strong> {{apiSuccessResponseMessage}}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            </div>
        </ng-template>

        <form (ngSubmit)="addExpense()" [formGroup]="addExpenseForm">
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="reason" placeholder="Reason" formControlName="reason" required>
              <label for="reason">Reason</label>
            </div>

            <div class="form-floating mb-3">
              <input type="number" class="form-control" id="cost" placeholder="Cost" min="0.01" step="0.01" formControlName="cost" required>
              <label for="cost">Cost</label>
            </div>

            <div class="form-floating mb-3">
              <select class="form-select" id="category" formControlName="category" required>
                <option selected disabled value="">Choose a category</option>
                <option value="Groceries">Groceries</option>
                <option value="Home">Home</option>
                <option value="Uncommon">Uncommon</option>
                <option value="Futile">Futile</option>
                <option value="Vehicle">Vehicle</option>
              </select>
              <label for="category">Category</label>
            </div>

            <div class="form-floating mb-3">
              <input type="date" class="form-control" id="date" placeholder="Date" formControlName="date" required>
              <label for="date">Date</label>
            </div>

            <div class="d-grid ">
                <button class="btn btn-primary" type="submit" disabled *ngIf="isApiLoading; else apiResponseLoaded">
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    Saving Expense...
                </button>
                <ng-template #apiResponseLoaded>
                    <button type="submit" class="btn btn-primary"> Save Expense </button>
                </ng-template>
            </div>
        </form>

        <ul class="list-group" *ngIf="expenseDataValidationErrors.length > 0">
            <span *ngFor="let msg of expenseDataValidationErrors">
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    {{msg}}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            </span>
        </ul>


    </div>

</div>
