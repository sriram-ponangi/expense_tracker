<div class="card shadow-lg">

    <div class="card-header mb-4 text-center">
        <h1 style="font-weight: bold">Expense Summary (Pie-Chart):</h1>
    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-6">
                <div class="form-floating mb-3">
                    <input type="date" class="form-control" id="startDate" placeholder="Start Date" [formControl]="startDateObject" required>
                    <label for="startDate">Start Date</label>
                </div>
            </div>

            <div class="col-md-6">
                <div class="form-floating mb-3">
                    <input type="date" class="form-control" id="endDate" placeholder="End Date" [formControl]="endDateObject" required [min]="startDateObject.value">
                    <label for="endDate">End Date</label>
                </div>
            </div>

            <div class=" d-grid">
                <button class="btn btn-primary" type="submit" disabled *ngIf="isApiLoading; else apiResponseLoadedButton">
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    Fetching Expenses...
                </button>
                <ng-template #apiResponseLoadedButton>
                    <button type="button" class="btn btn-primary" (click)="loadExpensePieChartData()"> Show Expenses Chart
                    </button>
                </ng-template>
            </div>

        </div>

        <div class="row mt-3">
            <div class="text-center" *ngIf="isApiLoading; else apiResponseLoaded">
                <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status">
                </div>
            </div>
            <ng-template #apiResponseLoaded>
                <div *ngIf="hasApiError; else successResponse">
                    <div class="alert alert-danger" role="alert">
                        Sorry, we are unable to show the pie-chart due to an issue with our server.
                        Please try again after some time.
                    </div>
                </div>
                <ng-template #successResponse>
                    <div *ngIf="isPieChartDataEmpty(); else showPieChart">
                        <div class="alert alert-info" role="alert">
                            Expense information not available for the selected date range.
                        </div>
                    </div>
                </ng-template>
                <ng-template #showPieChart>
                    <div class="chart">
                        <p-chart type="doughnut" [data]="pieChartDetails"  [responsive]="true" [options]="chartOptions"></p-chart>
                    </div>
                </ng-template>
            </ng-template>
        </div>

    </div>

    <!-- <div class="card-footer mb-5"> </div> -->

</div>
