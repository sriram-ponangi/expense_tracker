<div class="container">
    <div class="card my-5">
        <div class="card-body">
            <form (submit)="onSignIn(signInForm)" #signInForm="ngForm">
                <h1>Login</h1>
                <p>Please fill in this form to access your details.</p>
                <hr>
                <div class="text-center" *ngIf="hasFailedSignIn;">
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong>ERROR: </strong>{{failedSignInErrorMessage}}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" [(ngModel)]="email" name="email" required>
                    <label for="email">Email address</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Password" [(ngModel)]="password" name="password" required>
                    <label for="password">Password</label>
                </div>

                <div class="d-grid mb-3">
                    <button type="button" class="btn btn-link" disabled> Forgot Password? </button>
                </div>


                <div class="row">
                    <div class="d-grid mb-3 col-6">
                        <button type="submit" class="btn btn-primary"> Submit </button>
                    </div>

                    <div class="d-grid mb-3 col-6">
                        <button type="button" class="btn btn-secondary" (click)="navigateToSignUp();"> Sign Up </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
